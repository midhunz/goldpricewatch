name: Deploy

# The server owns its own infrastructure config. This workflow does not ship
# docker-compose.yaml, the Caddyfile or .env -- those live on the droplet and
# are edited there. Overwriting them from CI would clobber production settings
# that have drifted from this repo (the www redirect block, for one).
#
# What this workflow does ship
#   backend image        built from ./backend, pushed to Docker Hub, then pulled
#                        on the server
#   static /gold-rates   copied to ~/goldpricewatch/static, which the server's
#                        Caddy serves at /srv/static
#   frontend image       ONLY on a manual run with deploy_frontend=true, and
#                        only if the route guard passes. The source here covers
#                        6 of 37 live routes; shipping it 404s the rest.
#                        See docs/BLOCKED.md.
#
# Required REPOSITORY secrets (not environment secrets -- the guardrails job has
# no environment binding and cannot see those):
#   DOCKERHUB_USERNAME  DOCKERHUB_TOKEN
#   DROPLET_HOST        DROPLET_USER      DROPLET_SSH_KEY
# Required repository variables:
#   HEALTHCHECK_URL       e.g. https://goldpricewatch.com/api/health
#   NEXT_PUBLIC_API_URL   e.g. https://goldpricewatch.com/api
# Required GitHub Environment:
#   one named "production" (the deploy job targets it)
#
# Required on the server, by hand, once:
#   ~/goldpricewatch/.env             existing credentials
#   ~/goldpricewatch/static/          created by the first run of this workflow
#   docker-compose.yaml               caddy needs ./static:/srv/static:ro
#   Caddyfile                         needs a handle /gold-rates/* block
#                                     rooted at /srv/static
#   See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Rebuild the frontend and publish it as :latest (blocked unless the route guard passes)"
        type: boolean
        default: false
      build_frontend_candidate:
        description: "Build the frontend and push it as :candidate-<sha> only. Safe: nothing deploys it."
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: midhunpottammal
  BACKEND_IMAGE: gold-price-watch-backend
  FRONTEND_IMAGE: gold-price-watch-frontend
  DEPLOY_PATH: /root/goldpricewatch

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    outputs:
      frontend_safe: ${{ steps.routes.outputs.safe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Data + SEO guardrail tests
        run: python -m unittest discover -s tests -v

      - name: Frontend route completeness
        id: routes
        run: |
          if python scripts/check_frontend_routes.py; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Frontend deploy blocked"
              echo ""
              echo "The frontend source in this repo does not produce every route"
              echo "production serves, so its image will not be rebuilt or shipped."
              echo "The backend and the static /gold-rates pages deploy as normal."
              echo ""
              echo "See docs/BLOCKED.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify deploy configuration is present
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          missing=""
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY \
                      DOCKERHUB_USERNAME DOCKERHUB_TOKEN HEALTHCHECK_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets/variables:$missing"
            echo "Add them as REPOSITORY secrets/variables under"
            echo "Settings > Secrets and variables > Actions."
            echo "Environment-scoped secrets are NOT visible to this job."
            exit 1
          fi
          echo "All required secrets and variables are set."

  build-backend:
    name: Build & push backend
    needs: guardrails
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both tags are pushed. :latest is what the server's compose file pulls
      # today; the SHA tag exists so a rollback has something to point at once
      # that file uses ${IMAGE_TAG:-latest}.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # The image always includes frontend/public, so the 15 static rate pages are
  # baked in by construction -- Next.js serves public/ at the site root.
  #
  # Tagging is what keeps this safe. :latest is the tag production pulls, and it
  # may be the only surviving copy of the working 34-route UI, since that source
  # was never committed (docs/BLOCKED.md). So :latest is written ONLY when the
  # route guard passes. Otherwise the build is published as :candidate-<sha>,
  # which nothing deploys and which cannot overwrite anything.
  build-frontend:
    name: Build & push frontend
    needs: guardrails
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_frontend || inputs.build_frontend_candidate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Require NEXT_PUBLIC_API_URL
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is not set; the build would bake in a localhost fallback."
            exit 1
          fi

      - name: Choose tags
        id: tags
        env:
          SAFE: ${{ needs.guardrails.outputs.frontend_safe }}
          WANT_LATEST: ${{ inputs.deploy_frontend }}
          IMG: ${{ env.REGISTRY_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
        run: |
          if [ "$SAFE" = "true" ] && [ "$WANT_LATEST" = "true" ]; then
            printf 'tags=%s:latest\n%s:%s\n' "$IMG" "$IMG" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Route guard passed: publishing :latest and :${{ github.sha }}"
          else
            printf 'tags=%s:candidate-%s\n' "$IMG" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
            {
              echo "### Frontend published as a candidate only"
              echo ""
              echo "Pushed \`$IMG:candidate-${{ github.sha }}\`."
              echo ""
              echo "\`:latest\` was NOT overwritten, because the route guard"
              echo "reports this source does not build every live route."
              echo "Pull the candidate and compare it against production before"
              echo "promoting it. See docs/BLOCKED.md."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$WANT_LATEST" = "true" ]; then
              echo "::warning::deploy_frontend was requested but the route guard failed; published as a candidate instead of :latest."
            fi
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Records what the image can actually serve, so the candidate can be
      # judged on evidence rather than on the guard's summary alone.
      - name: Report routes the image produces
        run: |
          python scripts/check_frontend_routes.py --summary || true

  deploy:
    name: Deploy to droplet
    needs: [guardrails, build-backend]
    if: >-
      always() &&
      needs.build-backend.result == 'success' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Only the static pages travel. Staged into a flat directory so scp does
      # not have to mirror the repo layout.
      - name: Stage static pages
        run: |
          mkdir -p payload
          cp -r frontend/public/gold-rates payload/
          echo "Staged $(find payload -type f | wc -l) files:"
          find payload -type f | sort

      - name: Copy static pages to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "payload/gold-rates/*"
          target: ${{ env.DEPLOY_PATH }}/static/gold-rates
          strip_components: 2
          overwrite: true

      # The server owns its config, so this does not overwrite it -- it adds the
      # two things the static pages need, only if they are absent, and validates
      # both files against a throwaway container BEFORE the running stack is
      # touched. Any failure restores the backups and exits non-zero.
      #
      # Needed because production serves /gold-rates/*.html from the stale copies
      # baked into the frontend image, which cannot be rebuilt (docs/BLOCKED.md).
      # A Caddy handler rooted at the uploaded files takes precedence over the
      # catch-all proxy, so the clean pages win without any image build.
      - name: Ensure server serves the uploaded static pages
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            COMPOSE=docker-compose.yaml
            [ -f "$COMPOSE" ] || COMPOSE=docker-compose.yml
            if [ ! -f "$COMPOSE" ]; then
              echo "ERROR: no compose file in $DEPLOY_PATH" >&2
              exit 1
            fi
            echo "Using compose file: $COMPOSE"

            echo "--- current /gold-rates handling ---"
            grep -n -B2 -A6 'gold-rates' Caddyfile || echo "(no gold-rates handler present)"
            echo "--- current caddy volumes ---"
            grep -n -A15 'caddy:' "$COMPOSE" | grep -E 'volumes:|- \./|srv' || true

            STAMP=$(date +%Y%m%d-%H%M%S)
            cp Caddyfile "Caddyfile.bak.$STAMP"
            cp "$COMPOSE" "$COMPOSE.bak.$STAMP"
            echo "Backups: Caddyfile.bak.$STAMP  $COMPOSE.bak.$STAMP"

            # Armed before the first edit: any failure below -- a refused awk, a
            # rejected config, a failed restart -- puts both files back exactly
            # as they were. Without this an aborted run could leave the compose
            # file patched and the Caddyfile not.
            restore() {
              echo "::error::Server config change failed -- restoring backups."
              cp "Caddyfile.bak.$STAMP" Caddyfile
              cp "$COMPOSE.bak.$STAMP" "$COMPOSE"
              # If caddy was already restarted on the bad config, put it back on
              # the good one. Leaving the site down is worse than not fixing it.
              docker compose -f "$COMPOSE" up -d caddy || true
            }
            trap restore ERR

            changed=0

            # 1. Mount the uploaded pages into the caddy container.
            if grep -q '/srv/static' "$COMPOSE"; then
              echo "compose: /srv/static mount already present, leaving alone"
            else
              sed -i 's#^\( *\)- \./Caddyfile:/etc/caddy/Caddyfile\(.*\)$#&\n\1- ./static:/srv/static:ro#' "$COMPOSE"
              if grep -q '/srv/static' "$COMPOSE"; then
                echo "compose: added ./static:/srv/static:ro"
                changed=1
              else
                echo "ERROR: could not add the static mount automatically." >&2
                echo "       No '- ./Caddyfile:/etc/caddy/Caddyfile' line was found." >&2
                exit 1
              fi
            fi

            # 2. Serve /gold-rates/* from that mount, ahead of the catch-all.
            if grep -q 'handle /gold-rates/\*' Caddyfile; then
              echo "Caddyfile: a /gold-rates handler already exists, leaving alone"
            else
              awk '
                !ins && /handle[[:space:]]+\/\*[[:space:]]*\{/ {
                  print "    handle /gold-rates/* {"
                  print "        root * /srv/static"
                  print "        file_server"
                  print "    }"
                  print ""
                  ins = 1
                }
                { print }
                END { if (!ins) exit 3 }
              ' Caddyfile > Caddyfile.new
              echo "Caddyfile: inserted handle /gold-rates/* before the catch-all"
              mv Caddyfile.new Caddyfile
              changed=1
            fi

            if [ "$changed" -eq 0 ]; then
              echo "Server already configured; nothing to change."
              exit 0
            fi

            # Validate both files in a throwaway container before the running
            # stack sees them. The ERR trap restores on any failure here.
            docker compose -f "$COMPOSE" config -q
            # Placeholder values for the {$VAR} placeholders the Caddyfile uses.
            # The running container gets the real ones from compose; validation
            # only needs them non-empty, since `email {$ACME_EMAIL}` with an
            # unset variable collapses to a bare `email` and fails to parse.
            docker run --rm \
              -e ACME_EMAIL=validate@example.com \
              -e DOMAIN_NAME=example.com \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

            echo "Both files validate. Applying."
            docker compose -f "$COMPOSE" up -d caddy

            # Confirm Caddy actually serves the uploaded file, not the stale one.
            sleep 5
            if docker compose -f "$COMPOSE" exec -T caddy \
                 test -f /srv/static/gold-rates/kerala.html; then
              echo "Mount confirmed: /srv/static/gold-rates/kerala.html is visible to Caddy."
            else
              echo "::error::The uploaded pages are not visible inside the caddy container."
              false
            fi

            trap - ERR
            echo "Server configured."
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Record what is being deployed. Becomes a usable rollback target
            # once the compose file here pulls ${IMAGE_TAG:-latest}.
            if [ -f .deployed_tag ]; then
              cp .deployed_tag .previous_tag
            fi
            echo "$IMAGE_TAG" > .deployed_tag

            export IMAGE_TAG
            docker compose pull backend
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "--- running containers ---"
            docker compose ps
        env:
          IMAGE_TAG: ${{ needs.build-backend.outputs.tag }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "${{ vars.HEALTHCHECK_URL }}"; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check never passed"
          exit 1

      # The static pages are the point of most deploys, so verify them rather
      # than trusting that a green health check means the site is correct.
      - name: Verify static rate pages
        run: |
          url="https://goldpricewatch.com/gold-rates/kerala.html"
          if ! body=$(curl -fsS --max-time 15 "$url"); then
            echo "::warning::$url is not being served. The server's Caddyfile"
            echo "probably has no handle /gold-rates/* block, or its compose"
            echo "file does not mount ./static at /srv/static. See docs/DEPLOY.md."
            exit 0
          fi
          fail=0
          if ! printf '%s' "$body" | grep -q 'content="noindex,nofollow"'; then
            echo "::error::$url is missing its noindex directive"
            fail=1
          fi
          if printf '%s' "$body" | grep -qE '₹[0-9]|Rs\.?[0-9]'; then
            echo "::error::$url is serving a hardcoded rupee figure"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Static rate pages verified."
