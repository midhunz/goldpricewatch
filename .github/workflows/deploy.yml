name: Deploy

# The server owns its own infrastructure config. This workflow does not ship
# docker-compose.yaml, the Caddyfile or .env -- those live on the droplet and
# are edited there. Overwriting them from CI would clobber production settings
# that have drifted from this repo (the www redirect block, for one).
#
# What this workflow does ship
#   backend image        built from ./backend, pushed to Docker Hub, then pulled
#                        on the server
#   nothing else         the 15 static /gold-rates files are gone; every rate
#                        page is rendered by the backend image above
#   frontend image       ONLY on a manual run with deploy_frontend=true, and
#                        only if the route guard passes. The source here covers
#                        6 of 37 live routes; shipping it 404s the rest.
#                        See docs/BLOCKED.md.
#
# Required REPOSITORY secrets (not environment secrets -- the guardrails job has
# no environment binding and cannot see those):
#   DOCKERHUB_USERNAME  DOCKERHUB_TOKEN
#   DROPLET_HOST        DROPLET_USER      DROPLET_PASSWORD
#
# The droplet does not accept key auth -- it is password-only, so the SSH steps
# below authenticate with DROPLET_PASSWORD rather than a private key.
# Required repository variables:
#   HEALTHCHECK_URL       e.g. https://goldpricewatch.com/api/health
#   NEXT_PUBLIC_API_URL   e.g. https://goldpricewatch.com/api
# Required GitHub Environment:
#   one named "production" (the deploy job targets it)
#
# Required on the server, by hand, once:
#   ~/goldpricewatch/.env             existing credentials
#   Caddyfile                         needs /gold-rates/* and an @rendered
#                                     matcher both proxying to backend:8000.
#                                     Added automatically below if absent, then
#                                     validated before they apply.
#   See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Rebuild the frontend and publish it as :latest (blocked unless the route guard passes)"
        type: boolean
        default: false
      build_frontend_candidate:
        description: "Build the frontend and push it as :candidate-<sha> only. Safe: nothing deploys it."
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: midhunpottammal
  BACKEND_IMAGE: gold-price-watch-backend
  FRONTEND_IMAGE: gold-price-watch-frontend
  DEPLOY_PATH: /root/goldpricewatch

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    outputs:
      frontend_safe: ${{ steps.routes.outputs.safe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Data + SEO guardrail tests
        run: python -m unittest discover -s tests -v

      - name: Frontend route completeness
        id: routes
        run: |
          if python scripts/check_frontend_routes.py; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Frontend deploy blocked"
              echo ""
              echo "The frontend source in this repo does not produce every route"
              echo "production serves, so its image will not be rebuilt or shipped."
              echo "The backend and the static /gold-rates pages deploy as normal."
              echo ""
              echo "See docs/BLOCKED.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify deploy configuration is present
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_PASSWORD: ${{ secrets.DROPLET_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          missing=""
          for name in DROPLET_HOST DROPLET_USER DROPLET_PASSWORD \
                      DOCKERHUB_USERNAME DOCKERHUB_TOKEN HEALTHCHECK_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets/variables:$missing"
            echo "Add them as REPOSITORY secrets/variables under"
            echo "Settings > Secrets and variables > Actions."
            echo "Environment-scoped secrets are NOT visible to this job."
            exit 1
          fi
          echo "All required secrets and variables are set."

  build-backend:
    name: Build & push backend
    needs: guardrails
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both tags are pushed. :latest is what the server's compose file pulls
      # today; the SHA tag exists so a rollback has something to point at once
      # that file uses ${IMAGE_TAG:-latest}.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # The image always includes frontend/public, so the 15 static rate pages are
  # baked in by construction -- Next.js serves public/ at the site root.
  #
  # Tagging is what keeps this safe. :latest is the tag production pulls, and it
  # may be the only surviving copy of the working 34-route UI, since that source
  # was never committed (docs/BLOCKED.md). So :latest is written ONLY when the
  # route guard passes. Otherwise the build is published as :candidate-<sha>,
  # which nothing deploys and which cannot overwrite anything.
  build-frontend:
    name: Build & push frontend
    needs: guardrails
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_frontend || inputs.build_frontend_candidate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Require NEXT_PUBLIC_API_URL
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is not set; the build would bake in a localhost fallback."
            exit 1
          fi

      - name: Choose tags
        id: tags
        env:
          SAFE: ${{ needs.guardrails.outputs.frontend_safe }}
          WANT_LATEST: ${{ inputs.deploy_frontend }}
          IMG: ${{ env.REGISTRY_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
        run: |
          if [ "$SAFE" = "true" ] && [ "$WANT_LATEST" = "true" ]; then
            printf 'tags=%s:latest\n%s:%s\n' "$IMG" "$IMG" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Route guard passed: publishing :latest and :${{ github.sha }}"
          else
            printf 'tags=%s:candidate-%s\n' "$IMG" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
            {
              echo "### Frontend published as a candidate only"
              echo ""
              echo "Pushed \`$IMG:candidate-${{ github.sha }}\`."
              echo ""
              echo "\`:latest\` was NOT overwritten, because the route guard"
              echo "reports this source does not build every live route."
              echo "Pull the candidate and compare it against production before"
              echo "promoting it. See docs/BLOCKED.md."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$WANT_LATEST" = "true" ]; then
              echo "::warning::deploy_frontend was requested but the route guard failed; published as a candidate instead of :latest."
            fi
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Records what the image can actually serve, so the candidate can be
      # judged on evidence rather than on the guard's summary alone.
      - name: Report routes the image produces
        run: |
          python scripts/check_frontend_routes.py --summary || true

  deploy:
    name: Deploy to droplet
    needs: [guardrails, build-backend]
    if: >-
      always() &&
      needs.build-backend.result == 'success' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The server owns its config, so this does not overwrite it -- it makes the
      # routing changes the rendered pages need, only if they are absent, and
      # validates the file against a throwaway container BEFORE the running stack
      # is touched. Any failure restores the backup and exits non-zero.
      #
      # Needed because every rate page is now rendered by the backend
      # (backend/rate_pages.py), and the Next source for most of those routes is
      # not in this repo (docs/BLOCKED.md). Without these blocks the backend
      # deploys but Caddy keeps answering from Next and from stale files.
      - name: Ensure server routes the rendered rate pages
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            COMPOSE=docker-compose.yaml
            [ -f "$COMPOSE" ] || COMPOSE=docker-compose.yml
            if [ ! -f "$COMPOSE" ]; then
              echo "ERROR: no compose file in $DEPLOY_PATH" >&2
              exit 1
            fi
            echo "Using compose file: $COMPOSE"

            echo "--- current /gold-rates handling ---"
            grep -n -B2 -A6 'gold-rates' Caddyfile || echo "(no gold-rates handler present)"
            echo "--- current caddy volumes ---"
            grep -n -A15 'caddy:' "$COMPOSE" | grep -E 'volumes:|- \./|srv' || true

            STAMP=$(date +%Y%m%d-%H%M%S)
            cp Caddyfile "Caddyfile.bak.$STAMP"
            cp "$COMPOSE" "$COMPOSE.bak.$STAMP"
            echo "Backups: Caddyfile.bak.$STAMP  $COMPOSE.bak.$STAMP"

            # Armed before the first edit: any failure below -- a refused awk, a
            # rejected config, a failed restart -- puts both files back exactly
            # as they were. Without this an aborted run could leave the compose
            # file patched and the Caddyfile not.
            restore() {
              echo "::error::Server config change failed -- restoring backups."
              cp "Caddyfile.bak.$STAMP" Caddyfile
              cp "$COMPOSE.bak.$STAMP" "$COMPOSE"
              # If caddy was already restarted on the bad config, put it back on
              # the good one. Leaving the site down is worse than not fixing it.
              docker compose -f "$COMPOSE" up -d caddy || true
            }
            trap restore ERR

            changed=0

            # 1. Point /gold-rates/* at the backend renderer instead of at files.
            #
            #    All 15 files that used to live in /srv/static are gone: the 11
            #    India state pages and 4 Oman city pages are now rendered with
            #    live prices at the same URLs (backend/rate_pages.py). If the
            #    server still has a file_server block here it would serve the
            #    stale copies forever, so it is rewritten rather than skipped.
            if grep -q 'handle /gold-rates/\*' Caddyfile; then
              if awk '
                /handle[[:space:]]+\/gold-rates\/\*[[:space:]]*\{/ { inblk=1 }
                inblk && /reverse_proxy[[:space:]]+backend:8000/ { found=1 }
                inblk && /^[[:space:]]*\}/ { inblk=0 }
                END { exit !found }
              ' Caddyfile; then
                echo "Caddyfile: /gold-rates/* already proxies to the backend"
              else
                awk '
                  /handle[[:space:]]+\/gold-rates\/\*[[:space:]]*\{/ {
                    print "    handle /gold-rates/* {"
                    print "        reverse_proxy backend:8000"
                    print "    }"
                    skip = 1
                    next
                  }
                  skip && /^[[:space:]]*\}[[:space:]]*$/ { skip = 0; next }
                  skip { next }
                  { print }
                ' Caddyfile > Caddyfile.new
                echo "Caddyfile: /gold-rates/* now proxies to the backend renderer"
                mv Caddyfile.new Caddyfile
                changed=1
              fi
            else
              awk '
                !ins && /handle[[:space:]]+\/\*[[:space:]]*\{/ {
                  print "    handle /gold-rates/* {"
                  print "        reverse_proxy backend:8000"
                  print "    }"
                  print ""
                  ins = 1
                }
                { print }
                END { if (!ins) exit 3 }
              ' Caddyfile > Caddyfile.new
              echo "Caddyfile: inserted handle /gold-rates/* -> backend"
              mv Caddyfile.new Caddyfile
              changed=1
            fi

            # 2. Route the rate pages Next currently serves, and the sitemap, to
            #    the renderer as well. Without this the work deploys but stays
            #    unreachable: Caddy would keep handing /india-gold-prices and
            #    friends to Next, and the live prices, date-stamped titles and
            #    real sitemap lastmod would never be served.
            if grep -q '@rendered' Caddyfile; then
              echo "Caddyfile: an @rendered matcher already exists, leaving alone"
            else
              awk '
                !ins && /handle[[:space:]]+\/\*[[:space:]]*\{/ {
                  print "    @rendered path /oman-gold-prices \\"
                  print "                   /uae-gold-prices \\"
                  print "                   /qatar-gold-prices \\"
                  print "                   /saudi-arabia-gold-prices \\"
                  print "                   /bahrain-gold-prices \\"
                  print "                   /kuwait-gold-prices \\"
                  print "                   /india-gold-prices \\"
                  print "                   /dubai-gold-prices \\"
                  print "                   /abu-dhabi-gold-prices \\"
                  print "                   /sharjah-gold-prices \\"
                  print "                   /ajman-gold-prices \\"
                  print "                   /mumbai-gold-prices \\"
                  print "                   /bangalore-gold-prices \\"
                  print "                   /chennai-gold-prices \\"
                  print "                   /hyderabad-gold-prices \\"
                  print "                   /pune-gold-prices \\"
                  print "                   /sitemap.xml"
                  print "    handle @rendered {"
                  print "        reverse_proxy backend:8000"
                  print "    }"
                  print ""
                  ins = 1
                }
                { print }
                END { if (!ins) exit 3 }
              ' Caddyfile > Caddyfile.new
              echo "Caddyfile: inserted @rendered matcher before the catch-all"
              mv Caddyfile.new Caddyfile
              changed=1
            fi

            if [ "$changed" -eq 0 ]; then
              echo "Server already configured; nothing to change."
              exit 0
            fi

            # Validate both files in a throwaway container before the running
            # stack sees them. The ERR trap restores on any failure here.
            docker compose -f "$COMPOSE" config -q
            # Placeholder values for the {$VAR} placeholders the Caddyfile uses.
            # The running container gets the real ones from compose; validation
            # only needs them non-empty, since `email {$ACME_EMAIL}` with an
            # unset variable collapses to a bare `email` and fails to parse.
            docker run --rm \
              -e ACME_EMAIL=validate@example.com \
              -e DOMAIN_NAME=example.com \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

            echo "Both files validate. Applying."
            docker compose -f "$COMPOSE" up -d caddy

            trap - ERR
            echo "Server configured."
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script_stop: true
          envs: IMAGE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Record what is being deployed. Becomes a usable rollback target
            # once the compose file here pulls ${IMAGE_TAG:-latest}.
            if [ -f .deployed_tag ]; then
              cp .deployed_tag .previous_tag
            fi
            echo "$IMAGE_TAG" > .deployed_tag

            export IMAGE_TAG
            docker compose pull backend
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "--- running containers ---"
            docker compose ps
        env:
          IMAGE_TAG: ${{ needs.build-backend.outputs.tag }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "${{ vars.HEALTHCHECK_URL }}"; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check never passed"
          exit 1

      # The rate pages are the point of most deploys, so verify them rather than
      # trusting that a green health check means the site is correct.
      #
      # All 34 are rendered by the backend now (backend/rate_pages.py). A sample
      # is checked: one page per template shape, across three currencies and two
      # time zones, plus the two URL patterns.
      - name: Verify rendered rate pages
        run: |
          set -u
          gulf_date=$(TZ=Asia/Muscat date '+%-d %b')
          india_date=$(TZ=Asia/Kolkata date '+%-d %b')
          fail=0

          # One page per template shape. Read line by line rather than word
          # split: the expected date contains a space ("9 Sep"). The list is fed
          # in at the bottom of the loop.
          while IFS='|' read -r path currency want_date; do
            [ -n "$path" ] || continue
            url="https://goldpricewatch.com$path"

            if ! body=$(curl -fsS --max-time 20 "$url"); then
              echo "::error::$url is not being served. Check that the server's"
              echo "Caddyfile routes it to backend:8000 -- see the Caddyfile in"
              echo "this repo and the routing step above."
              fail=1
              continue
            fi

            # A page that could not verify a price renders an empty state and
            # noindexes itself. That is the feed being stale, not the deploy
            # being broken, so it warns rather than failing the run.
            if printf '%s' "$body" | grep -q 'name="robots" content="noindex'; then
              echo "::warning::$url is serving its empty state - the rate feed is"
              echo "stale. The page is behaving correctly; the feed is not."
              echo "Check the Prefect scrape."
              continue
            fi

            page_ok=1
            if ! printf '%s' "$body" | grep -qE "$currency [0-9]"; then
              echo "::error::$url is indexable but carries no $currency figure"
              fail=1; page_ok=0
            fi
            if ! printf '%s' "$body" | grep -q "<title>.*$want_date"; then
              echo "::error::$url title is missing today's date ($want_date)"
              printf '%s' "$body" | grep -o '<title>.*</title>' || true
              fail=1; page_ok=0
            fi
            if [ "$currency" != "INR" ] && printf '%s' "$body" | grep -qE '₹[0-9]'; then
              echo "::error::$url is serving a rupee figure for a non-Indian market"
              fail=1; page_ok=0
            fi
            if ! printf '%s' "$body" | grep -q '"@type":"Dataset"'; then
              echo "::error::$url is missing its Dataset structured data"
              fail=1; page_ok=0
            fi
            if ! printf '%s' "$body" | grep -q "rel=\"canonical\" href=\"https://goldpricewatch.com$path\""; then
              echo "::error::$url has no self-referencing canonical"
              fail=1; page_ok=0
            fi
            [ "$page_ok" -eq 1 ] && echo "Verified $url"
          done < <(printf '%s\n' "/oman-gold-prices|OMR|$gulf_date" "/gold-rates/muscat.html|OMR|$gulf_date" "/uae-gold-prices|AED|$gulf_date" "/ajman-gold-prices|AED|$gulf_date" "/india-gold-prices|INR|$india_date" "/gold-rates/kerala.html|INR|$india_date")

          # The sitemap exists to stop advertising a six-month-old lastmod, so a
          # lastmod from early 2026 means the Next route handler is still
          # answering and the Caddy override did not take.
          sm="https://goldpricewatch.com/sitemap.xml"
          if body=$(curl -fsS --max-time 20 "$sm"); then
            if printf '%s' "$body" | grep -qE '<lastmod>2026-0[12]-'; then
              echo "::error::$sm is still serving build-time lastmod values;"
              echo "the Caddy @rendered override is not routing it to the backend."
              fail=1
            else
              echo "Verified $sm"
            fi
          else
            echo "::warning::$sm could not be fetched."
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
